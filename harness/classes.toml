# Classes of change, and how a human approves each. Humans approve classes, not every PR.
#
#   per_pr     a person reviews this PR (high risk, new behaviour, anything unproven)
#   batch      a person approves the batch plan once; every instance that passes its checks
#              and its review joins the batch, and one command merges the batch
#   graduated  merges by policy on code we own, but only while the class's cases hold
#              pass^k on the current pack (harness/proofs/<class>.json, written by prove.sh)
#
# The router (harness/lib/router.ts) reads these rows. High-risk paths (CI, manifests,
# instruction files, security paths) send any change to per_pr, whatever its class says.

[classes.docs]
description = "Documentation: pages under docs/, the mkdocs nav, and docstrings in src/: mechanical, no behaviour change"
approval = "batch"
batch = "docs-2026-10"
graduated = false        # becomes true once prove.sh records pass^3 for the docs cases
auto_merge = false

[classes.bugfix]
description = "A bug fix with a reproducing test that fails on the base and passes on the result"
approval = "per_pr"
fail_first = true
graduated = false

[classes.feature]
description = "A small new option on an existing public function"
approval = "per_pr"
graduated = false

[classes.build]
description = "New behaviour with no release flag: a new command, module or endpoint the rule does not require to ship dark; acceptance checks fail on the base, the negatives hold, the reviewer reads the whole diff"
approval = "per_pr"
fail_first = true        # the acceptance checks that name the new behaviour must fail on the base
flag = "none"            # no release flag: the change is live once merged, so a person reads every PR
graduated = false

[classes.llm-tune]
description = "Only where the repository holds an LLM application: a change to a prompt, a tool description, an effort or model setting, scored on a named eval with a holdout"
approval = "per_pr"
requires_eval = true     # the spec's front matter must carry [eval] command and holdout, or plan.py refuses it
graduated = false
# What the workbench tells the session after the spec body. The acceptance criterion is a
# number, not a test: the eval's score on the held-out cases must move by more than the noise
# floor measured by running the current prompt twice.
template = """
## Hillclimb inside the session

- Run the eval command on the training set first and write down the score: that is the baseline.
- One lever per round: one line of the prompt, one tool description, one effort or model setting.
  Rerun the eval on the training set after each change. Keep the change if the score rose,
  revert it if not. Stop at the round cap.
- Never read, open or run the holdout. The final score is taken on the holdout once, by the
  workbench, after you finish, and goes in the packet beside the training score.
- Report the baseline, each lever tried with its training score, and what was kept.
"""

[classes.packaging]
description = "Anything that changes how the package is built, installed or invoked"
approval = "per_pr"
risk = "high"
graduated = false

[classes.maintenance]
description = "Recurring upkeep a schedule entry enqueues from harness/recurring/: flaky tests, docstring drift; small, reviewable, no new behaviour"
approval = "per_pr"      # the recurring template is approved once by a person; each dated instance still ends at a PR for a person
graduated = false

[classes.shaping]
description = "Phase 3 only: a plan and draft specs shaped from a documented intent; never code"
approval = "per_pr"      # a person approves each draft spec before any workbench runs it
graduated = false

[batches.docs-2026-10]
# One human yes for the whole batch plan. Each instance still passes its own checks and review.
approved = true
approved_by = "yogi.aradhye"
approved_at = "2026-10-12"
note = "Contributor documentation for the test workflow, issues #430 and #438"
