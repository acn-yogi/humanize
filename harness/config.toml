# Workbench demo harness. The runner reads this file from the BASE commit, never from a
# task's result, so a task cannot loosen its own harness.

[harness]
# Which phase of the adoption model this repository is in. The dispatcher's forecast, the
# router and the shaper all read it (harness/lib/plan.py puts it in every plan).
#
#   0  Assess          nothing runs; the readiness assessment (demo/assess.md) comes first
#   1  Assisted        people write the specs, Claude writes the code and opens PRs, and a
#                      person reviews and merges every PR (the router sends every result to per_pr)
#   2  Autonomous      by class: approved batches and graduated classes merge by policy, and
#                      only high-value or high-risk PRs reach a person (the routing that ran here)
#   3  Self-improving  the proving loop plus shaping: harness/bin/shape.sh turns a documented
#                      intent (intents/) into a plan and draft specs with fail-first checks
#
# A later phase keeps everything an earlier one allows. An operator may try another phase for
# one command with WORKBENCH_PHASE=N (the output says so); a task cannot, because a task never
# sees the operator's environment.
phase = 2

[github]
# PRs open on this fork and nowhere else. publish.sh refuses any other repository.
repo = "acn-yogi/humanize"
# Read only. Never pushed to, never commented on.
upstream = "python-humanize/humanize"
base = "main"

[models]
# The author and the adversarial reviewer are different models on purpose.
worker = "sonnet"
reviewer = "opus"
# The shaper (phase 3) plans and writes specs, never code. Its output is draft specs a person
# approves, so the cheaper model is enough; the fail-first checks catch a weak spec.
shaper = "sonnet"

[caps]
# Ceilings for every loop. A spec may lower any of these, never raise them.
max_turns = 40           # loop 1, session: claude -p --max-turns
max_budget_usd = 3.0     # loop 1, session: claude -p --max-budget-usd (a client-side estimate)
continuations = 3        # loop 2, finish: Stop-hook blocks per session
retries = 1              # loop 3, retry: claude --resume rounds per task
tasks_per_queue_run = 3  # loop 4, queue: tasks one dispatcher wake-up may start
parallel = 2             # loop 4, queue: workbenches at once
time_limit_sec = 1500    # wall clock for one claude -p session
review_max_turns = 25    # the adversarial reviewer's session
review_max_budget_usd = 1.0

[sandbox]
# Shell commands Claude runs reach only these hosts. The checks after the session reach none.
allowed_domains = ["pypi.org", "files.pythonhosted.org"]

[setup]
# Runs on the BASE commit with network, under bubblewrap, before Claude starts and before the
# checks. {venv} is the task's virtualenv; {src} is the tree being installed.
commands = [
  "uv venv -q --python python3 {venv}",
  "uv pip install -q -p {venv} -e '{src}[tests]'",
  # The repository's lint, at the version .pre-commit-config.yaml pins, so the Stop hook can run it.
  "uv pip install -q -p {venv} ruff==0.16.10",
]

[checks]
# The repository's own suite, run on every task in a fresh clone of the result, no network.
always = ["python -m pytest -q -p no:cacheprovider -x"]
# The repository's own lint, run by the Stop hook beside the spec's quick checks before Claude
# may finish, so a session cannot end with lint findings left for the reviewer (case
# lint-in-quick-checks). --no-fix: the hook reports, Claude fixes. The pack id covers the hook.
lint = ["ruff check --no-fix src tests"]

# ---- What starts the work -----------------------------------------------------------------------
# Three configurable triggers. A trigger only puts work into the queue: the dispatcher, the
# workbench and the sandboxed run are unchanged, and every task still runs under the caps
# above. The halt flag (the file runs/HALT, or WORKBENCH_HALT) beats every trigger: while it
# exists nothing starts, whatever the triggers say. harness/bin/dispatch.sh --watch runs them.
[triggers]

[triggers.ticket]
# Ticket watch: poll this fork's GitHub issues (never upstream) on an interval. An issue that
# carries the label, put there by a login in the approvers list, is the approval: the intake
# interview runs headless on the issue (shape.sh --issue) and the spec it writes is approved
# with approved_by = that login and trigger = "ticket:<number>". One issue, one task: a spec or
# ledger row with the same trigger means the issue already ran; a reopened issue counts again.
# If intake says the spec is not ready it stays a draft, and the open questions go back on the
# issue as a comment only when comment = true. harness/bin/watch-tickets.sh --dry-run shows
# which issues would start work and why, without starting anything.
enabled = false
source = "github"            # github issues on [github] repo; the fork, never upstream
label = "priority:high"
approvers = ["acn-yogi"]     # the label counts only when one of these logins added it
poll_minutes = 5
comment = false              # post the intake's open questions on a not-ready issue

# Schedule: cron entries (5 fields: minute hour day-of-month month day-of-week) with a
# timezone. Each entry either takes the approved queue (take = "queue", up to the caps) or
# enqueues a recurring maintenance spec from harness/recurring/<spec>.md as one dated,
# approved spec (spec = "<name>"). The first entry is the 30 minute timer the dispatcher
# always had; drop it to run the queue only from tickets or by hand.
[[triggers.schedule]]
cron = "*/30 * * * *"
tz = "UTC"
take = "queue"

[[triggers.schedule]]
cron = "0 6 * * 1"           # Mondays at 06:00: hunt for flaky tests
tz = "UTC"
spec = "flaky-test-hunt"

[[triggers.schedule]]
cron = "0 6 1 * *"           # the first of the month at 06:00: the docstring sweep
tz = "UTC"
spec = "docstring-sweep"

# Budget pool: "run until you spend $100" is pool_usd = 100, window = "run". The dispatcher
# keeps starting approved specs while the pool has at least one per-task cap
# (caps.max_budget_usd) left, debits each finished session's cost from the ledger, stops
# starting when the pool is exhausted (running tasks finish within their own caps) and writes
# a budget-exhausted row to the ledger. Windows: run (this dispatcher process), day, week,
# month (UTC calendar). pool_usd = 0 means no pool: unlimited within the caps.
# dispatch.sh --pool-usd N overrides pool_usd for one run.
[triggers.budget]
pool_usd = 0
window = "run"
